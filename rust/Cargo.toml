[workspace]
members = ["crates/chatweave-protocol", "crates/chatweave-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zz-howard/chatweave"

[workspace.dependencies]
chatweave-protocol = { path = "crates/chatweave-protocol", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
jsonschema = { version = "=0.29.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
pulldown-cmark = "0.13"
sha2 = "0.10"
axum = "0.8.3"
axum-test = "17.3.0"
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
